name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        run: python scripts/ci_changes.py
      - name: Verify change classification
        run: python -m unittest discover -s scripts -p test_ci_changes.py -v
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python scripts/verify-docs.py
  verify:
    needs: [changes, documentation]
    if: ${{ needs.changes.outputs.full == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Pipelines.WebSockets.sln --locked-mode
      - run: dotnet build Pipelines.WebSockets.sln -c Release --no-restore
      - run: dotnet test tests/Pipelines.WebSockets.Tests -c Release --no-build
      - run: dotnet run -c Release --no-build --project samples/Pipelines.WebSockets.Demo
      - name: Exercise every benchmark case
        run: dotnet run -c Release --no-build --project benchmarks/Pipelines.WebSockets.Benchmarks -- --filter '*' --job dry
      - name: Validate split and retained evidence
        run: python scripts/verify-evidence.py
      - name: Exercise the common streaming runner and lifecycle failures
        run: python -m unittest discover -s scripts -p test_streaming_benchmarks.py -v
      - name: Exercise separate-process streaming for both clients
        run: python scripts/streaming_benchmarks.py --no-build --output artifacts/ci-streaming --count 2 --warmup 1 --duration 2 --runs 1
      - name: Build portable Windows generator
        if: runner.os == 'Windows'
        run: python scripts/build-windows-generator.py
      - name: Check portable generator
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP 'lan-generator-package'
          Expand-Archive -Path '.\artifacts\lan-generator-win-x64\pipelines-websocket-generator-win-x64.zip' -DestinationPath $packageDir
          & (Join-Path $packageDir 'WebSocketLoadTest.exe') --mode server --listen 127.0.0.1 --port 0 --duration 1 --payload-bytes 128 --batch 20
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
